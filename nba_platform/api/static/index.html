<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Intelligent NBA Platform — Command Centre</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e;
          --blue:#388bfd; --green:#3fb950; --amber:#d29922; --red:#f85149; --purple:#a371f7; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center;
           justify-content:space-between; background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:650; }
  header h1 span { color:var(--blue); }
  .metrics { display:flex; gap:18px; font-size:12px; color:var(--muted); }
  .metrics b { color:var(--text); }
  .wrap { display:grid; grid-template-columns:280px 1fr 380px; gap:16px; padding:16px; height:calc(100vh - 56px); }
  .col { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:auto; }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
            margin:0; padding:12px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
  .pad { padding:12px 14px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#21262d; color:var(--text);
           border-radius:6px; padding:8px 10px; width:100%; text-align:left; margin-bottom:8px; }
  button:hover { border-color:var(--blue); }
  button.primary { background:var(--blue); border-color:var(--blue); text-align:center; font-weight:600; }
  button.green { background:var(--green); border-color:var(--green); text-align:center; color:#04130a; font-weight:600; }
  button.red { background:transparent; border-color:var(--red); color:var(--red); text-align:center; }
  input, textarea, select { width:100%; background:#0d1117; color:var(--text); border:1px solid var(--line);
           border-radius:6px; padding:7px; margin-bottom:8px; font:inherit; }
  label { font-size:11px; color:var(--muted); display:block; margin-bottom:3px; }
  .step { padding:8px 14px; border-bottom:1px solid #21262d; display:flex; gap:10px; align-items:baseline; }
  .step .n { color:var(--muted); font-variant-numeric:tabular-nums; min-width:22px; }
  .step .st { font-size:10px; text-transform:uppercase; color:var(--purple); min-width:120px; }
  .step .ti { font-weight:600; }
  .step .de { color:var(--muted); font-size:12px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .b-blue{background:rgba(56,139,253,.15);color:var(--blue);} .b-green{background:rgba(63,185,80,.15);color:var(--green);}
  .b-amber{background:rgba(210,153,34,.15);color:var(--amber);} .b-red{background:rgba(248,81,73,.15);color:var(--red);}
  .b-purple{background:rgba(163,113,247,.15);color:var(--purple);}
  .rec { border:1px solid var(--line); border-radius:8px; padding:11px; margin:10px 14px; }
  .rec.sel { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); }
  .rec h3 { margin:0 0 4px; font-size:14px; display:flex; justify-content:space-between; }
  .rec .desc { color:var(--muted); font-size:12.5px; margin-bottom:6px; }
  .rec .meta { font-size:11px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
  .rec .rationale { font-size:12px; margin-top:6px; padding-top:6px; border-top:1px dashed #21262d; color:#c9d1d9; }
  .risk-bar { display:flex; gap:3px; margin-top:6px; }
  .risk-bar span { height:5px; border-radius:3px; flex:1; background:#21262d; position:relative; overflow:hidden; }
  .risk-bar span i { position:absolute; inset:0; transform-origin:left; }
  .empty { color:var(--muted); padding:20px 14px; text-align:center; font-size:13px; }
  .pill { font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Intelligent <span>Next Best Action</span> Platform — Command Centre</h1>
  <div class="metrics" id="metrics"></div>
</header>
<div class="wrap">
  <div class="col">
    <h2>Trigger event</h2>
    <div class="pad" id="scenarios"></div>
    <h2>Custom event</h2>
    <div class="pad">
      <label>Type</label>
      <select id="f-type">
        <option>sensor_alert</option><option>billing_dispute</option><option>service_outage</option>
        <option>customer_complaint</option><option>capacity_alert</option><option>data_anomaly</option>
      </select>
      <label>Asset ID</label><input id="f-asset" placeholder="TR-441" />
      <label>Severity</label>
      <select id="f-sev"><option>CRITICAL</option><option>MAJOR</option><option>WARNING</option><option>INFO</option></select>
      <label>Description</label><textarea id="f-content" rows="3" placeholder="Describe the signal..."></textarea>
      <button class="primary" onclick="customEvent()">Run case</button>
    </div>
  </div>

  <div class="col">
    <h2>Live agent trace <span id="state-badge"></span></h2>
    <div id="trace"><div class="empty">Trigger an event to begin.</div></div>
  </div>

  <div class="col">
    <h2>Recommendations &amp; Human review</h2>
    <div id="review"><div class="empty">No active case.</div></div>
  </div>
</div>

<script>
let activeSid = null, selectedAction = null, pollTimer = null;

async function api(path, opts) { const r = await fetch(path, opts); return r.json(); }

async function loadMetrics() {
  const m = await api('/api/metrics');
  document.getElementById('metrics').innerHTML =
    `LLM <b>${m.llm_mode}</b> · episodic <b>${m.episodic_cases}</b> · vectors <b>${m.vector_chunks}</b> · ` +
    `patterns <b>${m.learning_patterns}</b> · audit <b>${m.audit_entries}</b> · cases <b>${m.sessions}</b>`;
}

async function loadScenarios() {
  const s = await api('/api/scenarios');
  document.getElementById('scenarios').innerHTML = s.map((x,i)=>
    `<button onclick='runScenario(${i})'>${x.label}</button>`).join('');
  window._scenarios = s;
}

async function runScenario(i) { await startEvent(window._scenarios[i].event); }

async function customEvent() {
  await startEvent({
    type: document.getElementById('f-type').value,
    asset_id: document.getElementById('f-asset').value || null,
    severity: document.getElementById('f-sev').value,
    raw_content: document.getElementById('f-content').value,
    source_type: 'manual',
  });
}

async function startEvent(event) {
  const r = await api('/api/events', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(event)});
  activeSid = r.session_id; selectedAction = null;
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, 900);
  poll();
}

const stateClass = s => ({RESOLVED:'b-green',CLOSED:'b-green',ESCALATED:'b-red',PARTIAL_RESOLVE:'b-amber',
  HUMAN_REVIEW:'b-amber',REPLANNING:'b-purple'}[s] || 'b-blue');

async function poll() {
  if (!activeSid) return;
  const snap = await api('/api/sessions/' + activeSid);
  loadMetrics();
  document.getElementById('state-badge').innerHTML =
    `<span class="badge ${stateClass(snap.state)}">${snap.state}</span>`;
  renderTrace(snap.trace || []);
  renderReview(snap);
  if (['CLOSED','RESOLVED','ESCALATED'].includes(snap.state) && !snap.awaiting_human) {
    clearInterval(pollTimer); pollTimer = null;
  }
}

function renderTrace(trace) {
  const el = document.getElementById('trace');
  if (!trace.length) { el.innerHTML = '<div class="empty">Starting…</div>'; return; }
  el.innerHTML = trace.map(s => `
    <div class="step">
      <span class="n">${s.step}</span>
      <span class="st">${s.state}</span>
      <span><span class="ti">${s.title}</span> ${s.detail?`<span class="de">— ${s.detail}</span>`:''}</span>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

function riskBar(risk) {
  if (!risk) return '';
  const dims = ['safety','financial','compliance','reputational','operational'];
  const col = v => v>=0.85?'#f85149':v>=0.6?'#d29922':v>=0.3?'#388bfd':'#3fb950';
  return '<div class="risk-bar">' + dims.map(d=>{
    const v = risk[d]||0;
    return `<span title="${d} ${v}"><i style="background:${col(v)};transform:scaleX(${v})"></i></span>`;
  }).join('') + '</div>';
}

function renderReview(snap) {
  const el = document.getElementById('review');
  const cands = snap.candidates || [];
  const exps = {}; (snap.explanations||[]).forEach(e => exps[e.action_id]=e);
  const review = snap.human_review || {};
  if (!cands.length) { el.innerHTML = '<div class="empty">Awaiting recommendations…</div>'; return; }

  let html = cands.map(c => {
    const e = exps[c.id] || {};
    const sel = c.id===selectedAction ? 'sel' : '';
    return `<div class="rec ${sel}" onclick="selectAction('${c.id}')">
      <h3><span>${c.action_type}</span><span class="pill">p ${c.priority_score.toFixed(2)} · c ${c.confidence.toFixed(2)}</span></h3>
      <div class="desc">${c.description}</div>
      <div class="meta"><span>impact ${c.estimated_impact}</span><span>eta ${c.estimated_duration}</span>
        ${c.precedent_case?`<span>precedent ${c.precedent_case}</span>`:''}</div>
      ${riskBar(c.risk)}
      ${e.rationale?`<div class="rationale">${e.rationale}</div>`:''}
    </div>`;
  }).join('');

  if (snap.awaiting_human) {
    if (!selectedAction) selectedAction = cands[0].id;
    html += `<div class="pad">
      <span class="badge b-amber">AWAITING HUMAN REVIEW</span>
      <label style="margin-top:10px">Modification / comment (optional)</label>
      <textarea id="mod" rows="2" placeholder="e.g. Notify affected customers before load transfer"></textarea>
      <button class="green" onclick="decide('approved')">Approve selected</button>
      <button class="primary" onclick="decide('modified')">Approve with modification</button>
      <button class="red" onclick="decide('rejected')">Reject</button>
    </div>`;
  } else if (review.decision && review.decision!=='pending') {
    const v = snap.verify || {};
    html += `<div class="pad">
      <span class="badge ${review.decision==='rejected'?'b-red':'b-green'}">Decision: ${review.decision}
        ${review.auto_approved?'(auto)':''}${review.emergency_override?'(override)':''}</span>
      <div class="pill" style="margin-top:8px">${review.comments||''}</div>
      ${v.resolved!==undefined?`<div class="pill" style="margin-top:8px">Verification:
        ${v.resolved?'✓ resolved':(v.partial_resolve?'~ partial':'✗ not resolved')} — ${v.reason||''}</div>`:''}
    </div>`;
  }
  el.innerHTML = html;
}

function selectAction(id) { selectedAction = id; poll(); }

async function decide(decision) {
  const mod = (document.getElementById('mod')||{}).value || '';
  await api('/api/sessions/'+activeSid+'/decision', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({decision, selected_action:selectedAction, modifications: mod?[mod]:[], comments: mod})});
  poll();
}

loadMetrics(); loadScenarios();
</script>
</body>
</html>
