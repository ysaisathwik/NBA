version: "3.9"

services:
  nba-platform:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NBA_FORCE_OFFLINE=${NBA_FORCE_OFFLINE:-0}
      # Persist SQLite inside the mounted volume when Supabase is not configured
      - NBA_DB_PATH=/app/data/nba_platform.db
    volumes:
      - nba_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  nba_data:
